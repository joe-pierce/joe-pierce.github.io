<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="theme-color" content="#17324d">

    <title>{{ page.title | default: site.title | escape }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
  </head>
  <body>
    <header class="print-header">
      <div class="print-header__identity">
        <h1>{{ page.title }}</h1>
        <p>{{ page.tagline }}</p>
      </div>
      <address class="print-header__contact">
        <a href="mailto:{{ page.email }}">{{ page.email }}</a>
        <a href="tel:{{ page.phone | remove: ' ' }}">{{ page.phone }}</a>
        <a href="{{ page.linkedin }}">linkedin.com/in/joe-pierce-b78139100</a>
        <a href="{{ page.github }}">github.com/joe-pierce</a>
      </address>
    </header>

    <div class="page-shell">
      <aside class="sidebar" aria-label="CV summary and navigation">
        <div class="sidebar__inner">
          <header class="identity">
            <a class="identity__name" href="{{ '/' | relative_url }}">{{ page.title }}</a>
            <p class="identity__tagline">{{ page.tagline }}</p>
          </header>

          <address class="contact-list">
            <a href="mailto:{{ page.email }}">{{ page.email }}</a>
            <a href="tel:{{ page.phone | remove: ' ' }}">{{ page.phone }}</a>
            <a href="{{ page.linkedin }}" rel="me">LinkedIn</a>
            <a href="{{ page.github }}" rel="me">GitHub</a>
          </address>

          <nav class="section-nav" aria-label="CV sections">
            <a href="#profile">Profile</a>
            <a href="#core-skills">Core skills</a>
            <a href="#professional-experience">Experience</a>
            <a href="#education">Education</a>
            <a href="#professional-membership">Membership</a>
          </nav>
        </div>
      </aside>

      <main class="cv-content" id="main-content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
