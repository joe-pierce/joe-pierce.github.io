<a class="contact-link" href="{{ include.href }}"{% if include.rel %} rel="{{ include.rel }}"{% endif %}>
  {% case include.kind %}
    {% when "email" %}
      <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3.5 6.5h17v11h-17zM4 7l8 6 8-6" />
      </svg>
    {% when "phone" %}
      <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7.1 3.5 10 7.7 8.2 9.5c1.1 2.4 3 4.3 5.4 5.4l1.8-1.8 4.2 2.9-.8 3.5c-7.5.4-14.3-6.4-13.9-13.9z" />
      </svg>
    {% when "linkedin" %}
      <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6.5 9.5v8M6.5 6.2v.1M10.5 17.5v-8m0 3.6c.7-2.1 5.5-2.8 5.5 1.5v2.9" />
      </svg>
  {% endcase %}
  <span>{{ include.label }}</span>
</a>
